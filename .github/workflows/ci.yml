name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

      # The spec's own fixtures, written by other implementations. Without this
      # checkout the fixture tests skip rather than fail, so CI must supply it —
      # otherwise the coverage that matters most is silently optional.
      - name: Fetch OCFL fixtures
        run: git clone --depth 1 https://github.com/OCFL/fixtures ../mocfl-fixtures

      - name: Test
        run: cargo test --all-targets
        env:
          OCFL_FIXTURES: ../mocfl-fixtures

      - run: cargo test --doc

  interop:
    name: rocfl cross-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # An independent OCFL implementation, as a CI tool only — never a
      # dependency of this crate. Two codebases sharing no lineage must agree on
      # the same bytes.
      - name: Install rocfl
        run: cargo install rocfl --no-default-features --locked

      - name: Emit an object
        run: cargo test --test interop -- --nocapture
        env:
          MOCFL_INTEROP_OUT: ${{ runner.temp }}/interop

      - name: Validate it with rocfl
        # This crate implements objects, not storage roots, so the directory has
        # no root declaration. Validating the whole directory reports that as a
        # storage-root error and exits 2 however valid the object is. Naming the
        # object checks it alone, and rocfl's exit status is the verdict: 0 for
        # a valid object (warnings included), non-zero for any object error.
        run: rocfl -r "${{ runner.temp }}/interop" validate --paths interop-object

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --all-targets
