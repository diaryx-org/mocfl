[workspace]
resolver = "2"
members = ["mocfl", "mocfl-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches the floor the sister crates hold (prov): edition 2024 needs 1.85, and
# let-chains in stable positions need 1.88.
rust-version = "1.88"
repository = "https://github.com/diaryx-org/mocfl"
homepage = "https://github.com/diaryx-org/mocfl"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The inventory is JSON, and fig is the family's parser/printer for config
# formats. Since fig 7 each language is a crate of its own, so `fig` is the core
# and `fig-json` the one language this crate asks for — every other language fig
# can speak is never compiled. Both are Rust throughout: no Zig, no C.
#
# No `serde` feature: the inventory model is mapped to and from fig's `Value`
# tree by hand. That is deliberate. The spec constrains the shape of
# `inventory.json` far more tightly than a derive can express (digests as map
# *keys*, a `head` that must name an existing version, version numbers that must
# be contiguous), and hand-mapping is where those constraints get *checked*
# rather than silently coerced.
fig = { version = "7", default-features = false }
fig-json = { version = "7", default-features = false, features = ["fig"] }

# The library. The CLI is a thin companion over it and adds nothing the library
# cannot do — with one exception it owns deliberately: the *clock*. `mocfl` is
# clockless by design, so the caller supplies every timestamp; the CLI is that
# caller, and formatting "now" as RFC 3339 is its job.
mocfl = { path = "mocfl", version = "0.1.0" }
